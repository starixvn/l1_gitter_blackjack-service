variables:
    WORKING_PATH: /var/www/l2/blackjack-service/
    DOCKER_SERVICE_NAME: l2-blackjack-service
    DOCKER_IMAGE_PATH: l2/game-services/blackjack-service
    PROJECT_NAME: l2-blackjack-service
    CONFIG_FILE_NAME: app-configs
    CONFIG_FILE_EXTENSION: js
    CONFIGS_SRC_DIR_PATH: ./configs
    CONFIG_CONTAINER_PATH: /opt/node_app/app/app-configs.js

stages:
    - test
    - build
    - post-build
    - deploy

include:
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "sonarqube/sonarqube.gitlab-ci.yml"
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "docker/before-script-docker.gitlab-ci.yml"
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "rules/l2-rules.gitlab-ci.yml"
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "docker/build-docker-image.gitlab-ci.yml"
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "docker/post-build-docker-image.gitlab-ci.yml"
    - project: "lumi-ops/ci-scripts"
      ref: master
      file: "docker/deploy-swarm-service.gitlab-ci.yml"
    - local: .gitlab-ci/deploy-local.gitlab-ci.yml
    - local: .gitlab-ci/deploy-sit.gitlab-ci.yml
    - local: .gitlab-ci/deploy-uat.gitlab-ci.yml
    - local: .gitlab-ci/deploy-prod.gitlab-ci.yml
