post_build_local:
    extends:
        - .post_build
        - .deploy:local:rules
    needs: ["build_image"]
    environment:
        name: LOCAL

deploy_local:
    extends:
        - .base_deploy_swarm_service
        - .deploy:local:rules
    needs: ["post_build_local"]
    variables:
        SERVER_IP: $SC_SWARM_LEADER_LOCAL
        SERVER_USER: $SC_SWARM_LEADER_LOCAL_SSH_USER
        SERVER_PORT: $SC_SWARM_LEADER_LOCAL_SSH_PORT
        SWARM_NODES: $SC_SWARM_CLUSTER_LOCAL
        SWARM_REPLICAS: 1
        NODE_LABEL: L2
        DOCKER_PUBLIC_PORT: 9005
        DOCKER_PRIVATE_PORT: 9005
        DOCKER_NETWORK_NAME: lumi-network
    environment:
        name: LOCAL
