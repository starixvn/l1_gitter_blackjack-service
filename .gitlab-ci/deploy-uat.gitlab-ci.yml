post_build_uat:
    extends:
        - .post_build
        - .deploy:uat:rules
    needs: ["build_image"]
    environment:
        name: UAT

deploy_uat:
    extends:
        - .base_deploy_swarm_service
        - .deploy:uat:rules
    needs: ["post_build_uat"]
    variables:
        SERVER_IP: $SC_SWARM_LEADER_SIT
        SERVER_USER: $SC_SWARM_LEADER_SIT_SSH_USER
        SERVER_PORT: $SC_SWARM_LEADER_SIT_SSH_PORT
        SWARM_NODES: $SC_SWARM_CLUSTER_SIT
        SWARM_REPLICAS: 1
        NODE_LABEL: L2
        DOCKER_PUBLIC_PORT: 7503
        DOCKER_PRIVATE_PORT: 7503
        DOCKER_NETWORK_NAME: lumi-network
    environment:
        name: UAT
